<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Font preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Jost:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop All Lighting — Floorlamp.ae</title>
  <meta name="description" content="Shop all modern floor lamps and wall lamps at Floorlamp.ae. Browse our full collection of contemporary lighting with UAE delivery.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://floorlamp.ae/pages/shop.html">
  <meta property="og:type"        content="website">
  <meta property="og:url"         content="https://floorlamp.ae/pages/shop.html">
  <meta property="og:title"       content="Shop All Lighting — Floorlamp.ae">
  <meta property="og:description" content="Browse our full collection of modern floor lamps and wall lamps. UAE delivery to all Emirates.">
  <meta property="og:image"       content="https://floorlamp.ae/assets/og-shop.jpg">
  <meta property="og:site_name"   content="Floorlamp.ae">
  <meta name="twitter:card"        content="summary_large_image">
  <meta name="twitter:title"       content="Shop All Lighting — Floorlamp.ae">
  <meta name="twitter:description" content="Modern floor lamps and wall lights. UAE delivery.">
  <link rel="icon" type="image/png" href="../src/assets/icons/Black and White Simple Interior Design Logo.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../src/assets/icons/Black and White Simple Interior Design Logo.png">
  <link rel="manifest" href="../manifest.webmanifest">
  <meta name="theme-color" content="#111111">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../src/css/variables.css">
  <link rel="stylesheet" href="../src/css/base.css">
  <link rel="stylesheet" href="../src/css/components.css">
  <link rel="stylesheet" href="../src/css/layout.css">
  <link rel="stylesheet" href="../src/css/pages.css">
  <link rel="stylesheet" href="../src/css/mobile.css">
</head>
<body data-page="shop">

<div id="nav-placeholder"></div>
<div id="search-placeholder"></div>
<div id="cart-placeholder"></div>

<main>
  <!-- Page Header -->
  <div class="page-header">
    <div class="container">
      <span class="eyebrow page-header__eyebrow">Collection</span>
      <h1>Shop All Lighting</h1>
      <p>Discover modern lighting designed for everyday living.</p>
    </div>
  </div>

  <!-- Sale Banner -->
  <div class="sale-banner" role="banner" aria-label="Sale announcement">
    <img src="../src/images/banner/ss-upscaled-4x.png" alt="50% off all products" class="sale-banner__bg" loading="eager">
    <div class="sale-banner__overlay"></div>
    <div class="sale-banner__inner">
      <span class="sale-banner__tag">Limited Time Offer</span>
      <h2 class="sale-banner__title">50% OFF<br><em>Everything</em></h2>
      <p class="sale-banner__sub">Shop our full collection of modern floor &amp; wall lamps at half price. UAE delivery.</p>
      <a href="#shop-grid" class="btn btn--gold sale-banner__cta">Shop the Sale</a>
    </div>
  </div>

  <section class="section" id="shop-grid">
    <div class="container">
      <!-- Toolbar -->
      <div class="shop-toolbar">
        <div class="shop-toolbar__left">
          <div class="filter-bar" data-filter-group aria-label="Filter by category">
            <button class="filter-tag active" data-filter="all" aria-pressed="true">All</button>
            <button class="filter-tag" data-filter="floor-lamps" aria-pressed="false">Floor Lamps</button>
            <button class="filter-tag" data-filter="wall-lamps"  aria-pressed="false">Wall Lamps</button>
          </div>
        </div>
        <div class="shop-toolbar__right">
          <span class="results-count" aria-live="polite"></span>
          <label for="sort-select" class="sr-only">Sort products</label>
          <select class="sort-select" id="sort-select" aria-label="Sort products">
            <option value="featured">Featured</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="newest">Newest</option>
          </select>
        </div>
      </div>

      <!-- Grid -->
      <div class="product-grid" data-product-grid aria-label="All products"></div>
    </div>
  </section>
</main>

<div id="footer-placeholder"></div>

<script src="../src/js/data.js"></script>
<script src="../src/js/components.js"></script>
<script src="../src/js/cart.js"></script>
<script src="../src/js/search.js"></script>
<script src="../src/js/ui.js"></script>
<script src="../src/js/main.js"></script>
</body>
</html>
